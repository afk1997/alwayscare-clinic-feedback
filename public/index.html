<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Always Care Animal Clinic - Feedback Forms</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐾 ALWAYS CARE ANIMAL CLINIC 💖</h1>
            <p class="subtitle">Your feedback helps us care better for the voiceless.</p>
        </div>
        
        <div class="clinic-selector">
            <h2>Select Your Clinic Location</h2>
            <div class="clinic-buttons">
                <a href="/ghatkopar" class="clinic-btn ghatkopar">
                    <span class="clinic-icon">🏥</span>
                    <span class="clinic-name">Ghatkopar Clinic</span>
                    <span class="clinic-subtitle">Submit Feedback</span>
                </a>
                <a href="/kandivali" class="clinic-btn kandivali">
                    <span class="clinic-icon">🏥</span>
                    <span class="clinic-name">Kandivali Clinic</span>
                    <span class="clinic-subtitle">Submit Feedback</span>
                </a>
            </div>
        </div>
        
        <div class="info-box">
            <p>💡 <strong>Monthly Prize:</strong> 3 feedback entries win a Free Blood Test or Vaccination for a stray!</p>
        </div>
    </div>
</body>
</html>
